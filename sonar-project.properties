sonar.projectKey=ArnaudFlaesch_Dash-Web
sonar.organization=arnaudflaesch

sonar.projectName=Dash-Web
sonar.projectVersion=1.0

# The specs live next to the code: they are analyzed as tests, not as sources
sonar.sources=src/app,src/styles,src/styles.scss
sonar.tests=src/app
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,src/app/pipes/safe.pipe.ts

sonar.javascript.lcov.reportPaths=coverage/Dash-Web/lcov.info

sonar.css.stylelint.reportPaths=styleLintReport.json
