<div id="miniwidget-list-container" class="row items-center gap-xs">
  <div id="miniwidget-list" class="row gap-xs">
    @for (miniWidget of miniWidgetList(); track miniWidget.id) {
      <div class="miniwidget-container">
        <ng-container
          *ngComponentOutlet="miniWidgetComponents[miniWidget.type]; injector: getMiniWidgetInjector(miniWidget)"
        />
      </div>
    }
  </div>
  <button
    (click)="openCreateMiniWidgetModal()"
    matTooltip="Ajouter un nouveau mini widget"
    id="add-mini-widget-button"
    mat-icon-button
  >
    <mat-icon aria-hidden="false">add</mat-icon>
  </button>
</div>
