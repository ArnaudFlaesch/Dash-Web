<div class="widget surface">
  @if (isModeEdit()) {
    <div class="widget-edit-mode column full-size">
      <div class="header-container row items-center">
        <div class="widget-header row items-center gap-xs">
          <mat-icon class="edit-mode-icon accent-text">tune</mat-icon>
          <span>Configuration du widget</span>
        </div>
        <div class="header-actions muted-text row">
          <button class="delete-button" mat-icon-button matTooltip="Supprimer le widget" (click)="toDeleteMode()">
            <mat-icon aria-hidden="false">delete_outline</mat-icon>
          </button>
        </div>
      </div>
      <div class="widget-body column">
        <div class="widget-edit-component-container column">
          <ng-container *ngTemplateOutlet="editComponent() ?? null" />
        </div>
        <div class="edit-component-actions row">
          @if (isWidgetLoaded() && widgetData()) {
            <button class="cancel-button" mat-button (click)="cancelEdition()">Annuler</button>
          }
          <button class="validate-button" mat-flat-button (click)="onValidation()" [disabled]="!isFormValid()">
            <mat-icon>check</mat-icon>
            Valider
          </button>
        </div>
      </div>
    </div>
  }

  @if (isModeDelete()) {
    <dash-delete-widget (cancelWidgetDeletion)="toReadMode()" (validateWidgetDeletion)="deleteWidget()" />
  }

  @if (isModeRead()) {
    <div class="widget-read-mode column full-height">
      <div class="header-container row items-center">
        <div class="widget-header row items-center gap-xs">
          <div *ngTemplateOutlet="headerIcon()"></div>
          <div *ngTemplateOutlet="headerTitle()"></div>
        </div>

        <div class="header-actions muted-text row">
          @if (additionalActions()) {
            <span>
              <ng-container *ngTemplateOutlet="additionalActions() ?? null" />
            </span>
          }

          <button mat-icon-button matTooltip="Actualiser le widget" (click)="refreshWidget()" class="refresh-button">
            <mat-icon aria-hidden="false">refresh</mat-icon>
          </button>
          @if (editComponent()) {
            <button mat-icon-button matTooltip="Modifier le widget" (click)="toEditMode()" class="edit-button">
              <mat-icon>settings</mat-icon>
            </button>
          }
        </div>
      </div>
      <div class="widget-body column">
        @if (isWidgetLoaded()) {
          <ng-container *ngTemplateOutlet="body()" />
        } @else {
          <div class="loading-spinner">
            <mat-spinner />
          </div>
        }
      </div>
    </div>
  }
</div>
