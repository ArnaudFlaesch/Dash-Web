<div class="widget">
  @if (isModeEdit()) {
    <div class="widget-edit-mode">
      <div class="header-container">
        <div class="header-actions">
          <button class="deleteButton" mat-icon-button matTooltip="Supprimer le widget" (click)="toDeleteMode()">
            <mat-icon aria-hidden="false">delete</mat-icon>
          </button>
        </div>
      </div>
      <div class="widget-body">
        <div class="widget-edit-component-container">
          <ng-container *ngTemplateOutlet="editComponent() ?? null" />
        </div>
        <div class="edit-component-actions">
          @if (isWidgetLoaded() && widgetData()) {
            <button class="cancelButton" mat-raised-button (click)="cancelEdition()">Annuler</button>
          }
          <button
            class="validateButton"
            mat-raised-button
            (click)="onValidation()"
            color="primary"
            [disabled]="!isFormValid()"
          >
            Valider
          </button>
        </div>
      </div>
    </div>
  }

  @if (isModeDelete()) {
    <dash-delete-widget (cancelWidgetDeletion)="toReadMode()" (validateWidgetDeletion)="deleteWidget()" />
  }

  @if (isModeRead()) {
    <div class="widget-read-mode">
      <div class="header-container">
        <div class="header">
          <div *ngTemplateOutlet="headerIcon()"></div>
          <div *ngTemplateOutlet="headerTitle()"></div>
        </div>

        <div class="header-actions">
          @if (additionalActions()) {
            <span>
              <ng-container *ngTemplateOutlet="additionalActions() ?? null" />
            </span>
          }

          <button mat-icon-button matTooltip="Actualiser le widget" (click)="refreshWidget()" class="refreshButton">
            <mat-icon aria-hidden="false">refresh</mat-icon>
          </button>
          @if (editComponent()) {
            <button mat-icon-button matTooltip="Modifier le widget" (click)="toEditMode()" class="editButton">
              <mat-icon>settings</mat-icon>
            </button>
          }
        </div>
      </div>
      <div class="widget-body">
        @if (isWidgetLoaded()) {
          <ng-container *ngTemplateOutlet="body()" />
        } @else {
          <div class="widget-loading-spinner">
            <mat-spinner />
          </div>
        }
      </div>
    </div>
  }
</div>
