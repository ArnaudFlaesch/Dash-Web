<dash-widget
  [widgetData]="{}"
  [isFormValid]="true"
  [isWidgetLoaded]="isWidgetLoaded()"
  (refreshWidgetAction)="refreshWidget()"
>
  <ng-template #headerIcon>
    <mat-icon>electric_bolt</mat-icon>
  </ng-template>

  <ng-template #headerTitle>
    <div class="ecowatt-widget-header">{{ labels.title }}</div>
  </ng-template>

  <ng-template #body>
    <div id="ecowatt-info-container" #iframeContainer class="full-size">
      <iframe
        [src]="ecowattIframeUrl | safe: 'resource_url'"
        [title]="labels.iframeTitle"
        [width]="iframeContainerWidth()"
        [height]="iframeContainerHeight()"
      ></iframe>
    </div>
  </ng-template>
</dash-widget>
