<mat-expansion-panel [title]="gameInfo().name" (opened)="loadAchievementsData()" hideToggle>
  <mat-expansion-panel-header>
    <mat-panel-title>
      <div class="game-info row items-center">
        <img [src]="gameInfo().gameImgSrc" alt="game icon" />
        <p>{{ gameInfo().name }}</p>
      </div>
    </mat-panel-title>
  </mat-expansion-panel-header>
  <ng-template matExpansionPanelContent>
    <div class="game-data-container row justify-between">
      @if (achievements().length) {
        <div class="game-achievements-data-container column">
          <a href="{{ gameInfo().playerAchievementUrl }}" class="game-achievements-data column">
            <div class="totalachievements">Succès : {{ achievements().length }}</div>
            <div class="completedAchievements">Succès complétés : {{ completedAchievements().length }}</div>
          </a>
          <a href="{{ gameInfo().appIdLink }}" class="hoverable-link"> Community hub </a>
        </div>

        <a href="{{ gameInfo().playerAchievementUrl }}" class="spinner-container">
          <div class="progress-value centered">{{ completionStatus() }}%</div>
          <mat-progress-spinner color="primary" mode="determinate" [value]="completionStatus()" />
        </a>
      }
    </div>
  </ng-template>
</mat-expansion-panel>
