<mat-expansion-panel [title]="gameInfo().name" (opened)="loadAchievementsData(steamUserId(), gameInfo())" hideToggle>
  <mat-expansion-panel-header>
    <mat-panel-title>
      <div class="game-info">
        <img [src]="gameInfo().gameImgSrc" alt="game icon" />
        <p>{{ gameInfo().name }}</p>
      </div>
    </mat-panel-title>
  </mat-expansion-panel-header>
  <ng-template matExpansionPanelContent>
    <div class="game-data-container">
      @if (achievements().length) {
        <div class="game-achievements-data-container">
          <a href="{{ gameInfo().playerAchievementUrl }}" class="game-achievements-data">
            <div class="totalachievements">Succès : {{ achievements().length }}</div>
            <div class="completedAchievements">Succès complétés : {{ completedAchievements().length }}</div>
          </a>
          <a href="{{ gameInfo().appIdLink }}" class="hoverable-link"> Community hub </a>
        </div>

        <a href="{{ gameInfo().playerAchievementUrl }}" class="spinner-container">
          <div class="progress-value">{{ completionStatus() }}%</div>
          <mat-progress-spinner color="primary" mode="determinate" [value]="completionStatus()" />
        </a>
      }
    </div>
  </ng-template>
</mat-expansion-panel>
