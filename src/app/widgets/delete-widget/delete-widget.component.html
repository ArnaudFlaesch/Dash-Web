<div id="delete-widget-container" class="column items-center justify-center">
  <mat-icon class="delete-widget-icon">delete_outline</mat-icon>
  <h4>Êtes-vous sûr de vouloir supprimer ce widget ?</h4>
  <div id="delete-widget-actions" class="row">
    <button (click)="cancelWidgetDeletion.emit()" mat-stroked-button class="cancelButton">Annuler</button>
    <button (click)="validateWidgetDeletion.emit()" mat-flat-button color="warn" class="validateDeletionButton">
      Supprimer
    </button>
  </div>
</div>
