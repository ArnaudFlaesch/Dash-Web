<div id="delete-widget-container" class="column items-center justify-center">
  <mat-icon class="delete-widget-icon">delete_outline</mat-icon>
  <h4>{{ labels.confirmDeletion }}</h4>
  <div id="delete-widget-actions" class="row">
    <button (click)="cancelWidgetDeletion.emit()" mat-stroked-button class="cancel-button">{{ labels.cancel }}</button>
    <button (click)="validateWidgetDeletion.emit()" mat-flat-button color="warn" class="validate-deletion-button">
      {{ labels.delete }}
    </button>
  </div>
</div>
