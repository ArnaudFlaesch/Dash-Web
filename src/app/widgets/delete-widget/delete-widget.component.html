<div id="delete-widget-container" class="column items-center justify-center">
  <h4>Êtes-vous sûr de vouloir supprimer ce widget ?</h4>
  <div id="delete-widget-actions" class="row">
    <button (click)="cancelWidgetDeletion.emit()" mat-raised-button class="cancelButton">Annuler</button>
    <button (click)="validateWidgetDeletion.emit()" mat-raised-button color="warn" class="validateDeletionButton">
      Supprimer
    </button>
  </div>
</div>
