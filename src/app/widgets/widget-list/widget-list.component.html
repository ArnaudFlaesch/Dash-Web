<!-- The widgets are displayed in a grid: they are sorted horizontally and vertically -->
<div
  id="widget-list"
  cdkDropList
  cdkDropListOrientation="mixed"
  (cdkDropListDropped)="drop($event)"
  [class.edit-mode]="toggleEditMode()"
>
  @for (widget of widgets(); track widget.id) {
    <div class="widget-container" cdkDrag cdkDragBoundary="#widget-list" [cdkDragDisabled]="!toggleEditMode()">
      <ng-container *ngComponentOutlet="widgetComponents[widget.type]; injector: getWidgetInjector(widget)" />
    </div>
  }
</div>
