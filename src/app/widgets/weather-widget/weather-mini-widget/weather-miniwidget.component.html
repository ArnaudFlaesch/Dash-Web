<dash-mini-widget
  [isFormValid]="isFormValid()"
  [widgetData]="getWidgetData()"
  [isWidgetLoaded]="isWidgetLoaded()"
  (refreshWidgetAction)="refreshWidget()"
>
  <ng-template #editComponent>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Ville</mat-label>
      <input id="city-name-input" matInput [formField]="configForm.city" placeholder="Saisissez de nom de la ville" />
    </mat-form-field>
  </ng-template>

  <ng-template #body>
    @if (weather(); as weather) {
      <div class="mini-widget-weather-container row">
        <img
          class="current-weather-icon"
          [src]="getIconFromWeatherApi(weather.weather[0].icon)"
          [matTooltip]="weather.weather[0].description | initialUppercase"
          [alt]="weather.weather[0].description"
        />
        <div class="weather-data-container column justify-center">
          <div class="city-name">{{ config().city }}</div>
          <div class="temperature-container row">
            <mat-icon matTooltip="Température actuelle">device_thermostat</mat-icon>
            <div>{{ weather.main.temp | number: "1.0-1" }} °C</div>
          </div>
        </div>
      </div>
    }
  </ng-template>
</dash-mini-widget>
