<dash-mini-widget
  [isFormValid]="isFormValid()"
  [widgetData]="widgetData()"
  [isWidgetLoaded]="isWidgetLoaded()"
  (refreshWidgetAction)="refreshWidget()"
>
  <ng-template #editComponent>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>{{ labels.city }}</mat-label>
      <input id="city-name-input" matInput [formField]="configForm.city" [placeholder]="labels.enterCityName" />
    </mat-form-field>
  </ng-template>

  <ng-template #body>
    @if (weather(); as weather) {
      <div class="mini-widget-weather-container row">
        <img
          class="current-weather-icon"
          [ngSrc]="getIconFromWeatherApi(weather.weather[0].icon)"
          width="100"
          height="100"
          [matTooltip]="weather.weather[0].description | initialUppercase"
          matTooltipTouchGestures="off"
          [alt]="weather.weather[0].description"
        />
        <div class="weather-data-container column justify-center">
          <div class="city-name">{{ config().city }}</div>
          <div class="temperature-container muted-text row">
            <mat-icon [matTooltip]="labels.currentTemperature" matTooltipTouchGestures="off"
              >device_thermostat</mat-icon
            >
            <div>{{ weather.main.temp | number: "1.0-1" }} {{ labels.celsius }}</div>
          </div>
        </div>
      </div>
    }
  </ng-template>
</dash-mini-widget>
