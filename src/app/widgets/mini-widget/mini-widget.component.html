<div class="mini-widget">
  @if (isModeEdit()) {
    <div class="edit-mini-widget row">
      <ng-container *ngTemplateOutlet="editComponent() ?? null" />

      @if (isWidgetLoaded() && widgetData()) {
        <button class="cancel-button" [matTooltip]="labels.cancel" mat-icon-button (click)="cancelEdition()">
          <mat-icon>undo</mat-icon>
        </button>
      }

      <button
        class="validate-button"
        [matTooltip]="labels.validate"
        mat-icon-button
        (click)="onValidation()"
        color="primary"
        [disabled]="!isFormValid()"
      >
        <mat-icon>check</mat-icon>
      </button>
      <button mat-icon-button [matTooltip]="labels.deleteWidget" (click)="toDeleteMode()" color="alert">
        <mat-icon aria-hidden="false">delete</mat-icon>
      </button>
    </div>
  }

  @if (isModeDelete()) {
    <div class="delete-mini-widget">
      <h4>{{ labels.confirmDeletion }}</h4>
      <div id="delete-mini-widget-actions" class="row gap-sm">
        <button (click)="toReadMode()" mat-button class="cancel-button">{{ labels.cancel }}</button>
        <button (click)="deleteMiniWidget()" mat-raised-button color="warn" class="validate-deletion-button">
          {{ labels.delete }}
        </button>
      </div>
    </div>
  }

  @if (isModeRead()) {
    <!-- Touch gestures are kept, so that the list of mini widgets can be scrolled on phones -->
    <div
      (dblclick)="toEditMode()"
      [matTooltip]="labels.doubleClickToEdit"
      [matTooltipShowDelay]="800"
      matTooltipTouchGestures="off"
    >
      <div class="read-mini-widget-body-container">
        @if (isWidgetLoaded()) {
          <ng-container *ngTemplateOutlet="body()" />
        } @else {
          <div class="loading-spinner">
            <mat-spinner diameter="32" />
          </div>
        }
      </div>
    </div>
  }
</div>
