<div class="mini-widget">
  @if (isModeEdit()) {
    <div class="edit-mini-widget row">
      <ng-container *ngTemplateOutlet="editComponent() ?? null" />

      @if (isWidgetLoaded() && widgetData()) {
        <button class="cancelButton" matTooltip="Annuler" mat-icon-button (click)="cancelEdition()">
          <mat-icon>undo</mat-icon>
        </button>
      }

      <button
        class="validateButton"
        matTooltip="Valider"
        mat-icon-button
        (click)="onValidation()"
        color="primary"
        [disabled]="!isFormValid()"
      >
        <mat-icon>check</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Supprimer le widget" (click)="toDeleteMode()" color="alert">
        <mat-icon aria-hidden="false">delete</mat-icon>
      </button>
    </div>
  }

  @if (isModeDelete()) {
    <div>
      <h4>Êtes-vous sûr de vouloir supprimer ce widget ?</h4>
      <div id="delete-mini-widget-actions">
        <button (click)="deleteMiniWidget()" mat-raised-button color="warn" class="validateDeletionButton">
          Supprimer
        </button>
      </div>
    </div>
  }

  @if (isModeRead()) {
    <div (dblclick)="toEditMode()">
      <div class="read-mini-widget-body-container">
        @if (isWidgetLoaded()) {
          <ng-container *ngTemplateOutlet="body()" />
        } @else {
          <div class="loading-spinner">
            <mat-spinner />
          </div>
        }
      </div>
    </div>
  }
</div>
