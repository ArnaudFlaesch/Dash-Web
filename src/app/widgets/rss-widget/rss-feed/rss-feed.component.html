<mat-accordion>
  @for (article of feed(); track article.link) {
    <mat-expansion-panel
      hideToggle
      class="rss-article flat-panel"
      (opened)="onOpenDetail(article.guid)"
      (closed)="onClosePanel()"
    >
      <mat-expansion-panel-header>
        <mat-panel-title
          [class.article-opened]="isArticleOpened(article.guid)"
          [class.is-read]="isArticleRead(article.guid)"
          class="article-title"
        >
          <p>{{ formatTitleForArticle(article) }}</p>
        </mat-panel-title>
      </mat-expansion-panel-header>
      <ng-template matExpansionPanelContent>
        <div class="rss-feed-content">
          <a [href]="article.link | safe: 'url'">
            <div class="article-content">
              {{ stripHtmlFromContent(article.description) }}
            </div>
            <div class="article-pubdate muted-text">
              Publié le
              {{ (article.pubDate ? article.pubDate : article.updated) || "" | dateFormat }}
              {{ article.author && "par " + article.author }}
            </div>
          </a>
        </div>
      </ng-template>
    </mat-expansion-panel>
  }
</mat-accordion>
