<dash-widget
  [widgetData]="getWidgetData()"
  [isFormValid]="isFormValid()"
  [isWidgetLoaded]="isWidgetLoaded()"
  (refreshWidgetAction)="refreshWidget()"
>
  <ng-template #headerIcon>
    <img class="rss-widget-header" src="{{ rssFeedResult()?.image?.url }}" alt="logo" />
  </ng-template>

  <ng-template #headerTitle>
    @if (rssFeedResult(); as rssFeedResult) {
      @if (rssFeedResult.image && rssFeedResult.image.link !== undefined) {
        <a [href]="rssFeedResult.image.link | safe: 'url'">
          <div class="rss-title">{{ rssFeedResult.title }}</div>
        </a>
      }
    }
  </ng-template>

  <ng-template #editComponent>
    <mat-form-field appearance="fill">
      <mat-label>URL</mat-label>
      <input matInput id="rssFeedUrl" [formField]="configForm.url" placeholder="Saisissez l'URL du flux RSS" />
    </mat-form-field>
  </ng-template>

  <ng-template #additionalActions>
    <button
      mat-icon-button
      matTooltip="Marquer tout le flux comme lu"
      class="markAllArticlesAsReadButton"
      (click)="markAllFeedAsRead()"
    >
      <mat-icon>check</mat-icon>
    </button>
  </ng-template>

  <ng-template #body>
    @if (config().url) {
      <div class="rss-widget-body">
        <div class="rss-widget-description">{{ rssFeedResult()?.description }}</div>
        <dash-rss-feed
          [feed]="rssFeedResult()?.item ?? []"
          [readArticles]="readArticles()"
          (markArticleAsReadEvent)="markArticleAsRead($event)"
        />
      </div>
    }
  </ng-template>
</dash-widget>
