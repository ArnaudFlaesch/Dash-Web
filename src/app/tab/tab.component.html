@if (editMode()) {
  <div class="tab-input row">
    <input
      id="tabNameInput"
      aria-label="Tab name"
      (keydown)="enterSaveTabName($event)"
      (dblclick)="saveTabName()"
      [formField]="tabLabelForm"
    />
    <mat-icon class="deleteTabButton" (keydown)="deleteTabFromDash()" (click)="deleteTabFromDash()"> delete </mat-icon>
  </div>
} @else {
  <div class="tab-label" (dblclick)="toggleEditMode()">
    {{ tabLabel() }}
  </div>
}
