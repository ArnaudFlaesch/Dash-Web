@if (editMode()) {
  <div class="tab-input row items-center gap-xs">
    <input
      id="tab-name-input"
      class="tab-name-input"
      [attr.aria-label]="labels.tabName"
      (keydown.enter)="saveTabName()"
      (dblclick)="saveTabName()"
      [formField]="tabLabelForm"
    />
    <mat-icon
      class="save-tab-button accent-text"
      role="button"
      [attr.aria-label]="labels.saveName"
      [title]="labels.save"
      (keydown.enter)="saveTabName()"
      (click)="saveTabName()"
      tabindex="0"
    >
      check
    </mat-icon>
    <mat-icon
      class="delete-tab-button"
      role="button"
      [attr.aria-label]="labels.deleteTab"
      [title]="labels.deleteTab"
      (keydown.enter)="deleteTabFromDash()"
      (click)="deleteTabFromDash()"
      tabindex="0"
    >
      delete
    </mat-icon>
  </div>
} @else {
  <div class="tab-label" (dblclick)="toggleEditMode()">
    {{ tabLabel() }}
  </div>
}
