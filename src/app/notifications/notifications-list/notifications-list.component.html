<button
  id="display-notifications-button"
  matTooltip="Notifications"
  color="primary"
  mat-mini-fab
  [matMenuTriggerFor]="notificationsMenu"
>
  <mat-icon [matBadge]="unreadNotificationsForBadge() || ''" aria-hidden="false">notifications</mat-icon>
</button>

<mat-menu #notificationsMenu="matMenu">
  @if (unreadNotificationsForBadge()) {
    <button
      id="mark-all-notifications-as-read-button"
      matTooltip="Marquer tout comme lu"
      (click)="markAllNotificationsAsReadEvent.emit()"
      mat-icon-button
    >
      <mat-icon>check</mat-icon>
    </button>
  }
  @for (notification of notificationsList(); track notification.id) {
    <div
      class="notification-container row items-center gap-xs"
      [class.unread-notification]="!notification.isRead"
      [class.info]="notification.notificationType === notificationTypeEnum.INFO"
      [class.warn]="notification.notificationType === notificationTypeEnum.WARN"
    >
      <span>{{ notification.message }}</span>
      <span [matTooltip]="notification.notificationDate | dateFormat: 'short'" class="notification-date">
        {{ notification.notificationDateToDisplay }}
      </span>
      <mat-icon>{{ notification.notificationTypeToDisplay }}</mat-icon>
      @if (!notification.isRead) {
        <button
          class="mark-notification-as-read-button"
          (click)="markNotificationAsReadEvent.emit(notification.id)"
          mat-icon-button
        >
          <mat-icon>check</mat-icon>
        </button>
      }
    </div>
  }
</mat-menu>
