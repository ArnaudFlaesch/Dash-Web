<h1 mat-dialog-title>Ajouter un mini widget</h1>

<mat-dialog-content>
  <div class="widget-types-list">
    @for (miniWidgetType of miniWidgetTypes; track miniWidgetType.type) {
      <mat-card>
        <mat-card-content class="widget-type-container column items-center gap-md">
          <mat-icon>{{ miniWidgetType.icon }}</mat-icon>
          <span>{{ miniWidgetType.type }}</span>
        </mat-card-content>
        <mat-card-actions>
          <button [id]="miniWidgetType.type" mat-raised-button color="primary" [mat-dialog-close]="miniWidgetType.type">
            Ajouter
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions><button mat-raised-button mat-dialog-close color="warn">Fermer</button></mat-dialog-actions>
