<h1 mat-dialog-title>Ajouter un mini widget</h1>

<mat-dialog-content>
  <div id="widget-types-list">
    @for (miniWidgetType of miniWidgetTypes; track miniWidgetType.type) {
      <button
        class="widget-type-tile tile column items-center gap-sm"
        [id]="miniWidgetType.type"
        [mat-dialog-close]="miniWidgetType.type"
      >
        <mat-icon class="accent-text">{{ miniWidgetType.icon }}</mat-icon>
        <span>{{ miniWidgetType.label }}</span>
      </button>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions><button mat-button mat-dialog-close>Fermer</button></mat-dialog-actions>
