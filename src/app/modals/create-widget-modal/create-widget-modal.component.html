<h1 mat-dialog-title>Ajouter un widget</h1>

<mat-dialog-content>
  <div id="widget-types-list">
    @for (widgetType of widgetTypes; track widgetType.type) {
      <button
        class="widget-type-tile tile column items-center gap-sm"
        [id]="widgetType.type"
        [mat-dialog-close]="widgetType.type"
      >
        <mat-icon class="accent-text">{{ widgetType.icon }}</mat-icon>
        <span>{{ widgetType.label }}</span>
      </button>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions><button mat-button mat-dialog-close>Fermer</button></mat-dialog-actions>
