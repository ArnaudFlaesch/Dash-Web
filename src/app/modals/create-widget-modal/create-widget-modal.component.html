<h1 mat-dialog-title>Ajouter un widget</h1>

<mat-dialog-content>
  <div class="widget-types-list">
    @for (widgetType of widgetTypes; track widgetType.type) {
      <mat-card>
        <mat-card-content class="widget-type-container column items-center gap-md">
          <mat-icon>{{ widgetType.icon }}</mat-icon>
          <span>{{ widgetType.type }}</span>
        </mat-card-content>
        <mat-card-actions>
          <button [id]="widgetType.type" mat-raised-button color="primary" [mat-dialog-close]="widgetType.type">
            Ajouter
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions><button mat-raised-button mat-dialog-close color="warn">Fermer</button></mat-dialog-actions>
