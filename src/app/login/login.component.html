<div id="login-page" class="row full-height">
  <div id="login-container" class="column items-center">
    <a routerLink href="/home" id="logo-container">
      <img src="assets/logo.png" id="dash-logo" alt="dash logo" />
    </a>
    <div>
      <h1 id="login-page-title">Dash</h1>
    </div>
    <div id="login-form" class="column gap-md">
      <input id="inputUsername" placeholder="Username" [formField]="loginForm.username" aria-label="Username" />

      <input
        id="inputPassword"
        placeholder="Password"
        type="password"
        [formField]="loginForm.password"
        aria-label="Password"
      />

      <button
        mat-raised-button
        id="loginButton"
        [disabled]="loginForm().invalid() || isLoading()"
        (click)="handleLogin()"
        color="primary"
      >
        <span id="login-button-label" class="row items-center">
          @if (isLoading()) {
            <mat-spinner diameter="30" />
          }
          <span>Se connecter</span>
        </span>
      </button>

      <button mat-raised-button color="accent" (click)="loginAsDemoAccount()">Démo</button>
    </div>
  </div>
</div>
