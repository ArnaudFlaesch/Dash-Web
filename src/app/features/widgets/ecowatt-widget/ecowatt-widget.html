<dash-widget [widgetData]="{}" [isFormValid]="true" [isWidgetLoaded]="true" (refreshWidgetAction)="refreshWidget()">
  <ng-template #headerIcon>
    <mat-icon>electric_bolt</mat-icon>
  </ng-template>

  <ng-template #headerTitle>
    <div class="ecowatt-widget-header">{{ labels.title }}</div>
  </ng-template>

  <ng-template #body>
    <!-- Static source: trusted by Angular, without bypassing its sanitizer -->
    <!-- Sized by its style to the widget body, also when the widget is resized without the window -->
    <iframe
      #iframe
      class="ecowatt-iframe"
      src="https://www.monecowatt.fr/preview-homepage?prevision=1&amp;map=0&amp;ecogestes=0"
      [title]="labels.iframeTitle"
    ></iframe>
  </ng-template>
</dash-widget>
