<dash-widget
  [widgetData]="{}"
  (refreshWidgetAction)="refreshWidget()"
  [isFormValid]="true"
  [isWidgetLoaded]="isWidgetLoaded()"
>
  <ng-template #headerIcon>
    @if (athlete(); as athlete) {
      <a [href]="getAthleteProfileUrl(athlete.id)" id="strava-widget-header">
        <img
          [ngSrc]="athlete.profileMedium"
          width="62"
          height="62"
          id="strava-profile-picture"
          [alt]="labels.athleteProfile"
        />
      </a>
    } @else {
      <mat-icon>directions_run</mat-icon>
    }
  </ng-template>

  <ng-template #headerTitle>
    @if (athlete(); as athlete) {
      <div class="strava-header">{{ athlete.firstname }} {{ athlete.lastname }}</div>
    } @else {
      <div>{{ labels.strava }}</div>
    }
  </ng-template>

  <ng-template #body>
    <dash-strava-widget-view
      class="column full-height"
      [isUserLoggedIn]="isUserLoggedIn()"
      [activities]="activities()"
      [pageNumber]="pageNumber()"
      [paginationActivities]="paginationActivities"
      (loginRequested)="loginToStrava()"
      (moreRecentActivitiesRequested)="showMoreRecentActivities()"
      (olderActivitiesRequested)="showOlderActivities()"
    />
  </ng-template>
</dash-widget>
