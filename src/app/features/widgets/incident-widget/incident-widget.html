<dash-widget
  [widgetData]="widgetData()"
  [isFormValid]="isFormValid()"
  [isWidgetLoaded]="isWidgetLoaded()"
  (refreshWidgetAction)="refreshWidget()"
  (editionCancelled)="restoreSavedConfig()"
>
  <ng-template #headerIcon>
    <mat-icon>priority_high</mat-icon>
  </ng-template>

  <ng-template #headerTitle>
    <div>{{ labels.incident }} {{ config().incidentName }}</div>
  </ng-template>

  <ng-template #editComponent>
    <mat-form-field appearance="outline">
      <mat-label>{{ labels.incidentType }}</mat-label>
      <input
        id="incident-name"
        matInput
        [formField]="configForm.incidentName"
        [placeholder]="labels.incidentTypePlaceholder"
      />
    </mat-form-field>
  </ng-template>

  <ng-template #body>
    <dash-incident-widget-view
      class="column full-height"
      [lastIncidentDate]="lastIncidentDate()"
      [streaks]="streaks()"
      (newStreakRequested)="startNewStreak()"
      (streakEndRequested)="openEndStreakModal()"
    />
  </ng-template>
</dash-widget>
