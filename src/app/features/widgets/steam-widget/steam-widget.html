<dash-widget
  [widgetData]="widgetData()"
  [isFormValid]="isFormValid()"
  (refreshWidgetAction)="refreshWidget()"
  (editionCancelled)="restoreSavedConfig()"
  [isWidgetLoaded]="true"
>
  <ng-template #headerIcon>
    @if (playerData(); as playerData) {
      <a [href]="playerData.profileurl" class="steam-header">
        <img [ngSrc]="playerData.avatar" width="32" height="32" [alt]="playerData.personaname" />
      </a>
    }
  </ng-template>

  <ng-template #headerTitle>
    <div>
      <a [href]="playerData()?.profileurl ?? ''" class="steam-header">
        {{ playerData()?.personaname }}
      </a>
    </div>
  </ng-template>

  <ng-template #editComponent>
    <mat-form-field appearance="outline">
      <mat-label id="steam-user-id-label">{{ labels.steamUser }}</mat-label>
      <input
        matInput
        id="steam-user-id-input"
        [formField]="configForm.steamUserId"
        [placeholder]="labels.enterSteamUserId"
      />
    </mat-form-field>
  </ng-template>

  <ng-template #body>
    <dash-steam-widget-view
      class="steam-widget-view column"
      [searchQuery]="searchQuery()"
      [isGamesListDisplayed]="isGamesListDisplayed()"
      [isGamesLoading]="isOwnedGamesLoading()"
      [games]="ownedGamesDisplay()"
      [gameCount]="gameCount()"
      [pageNumber]="pageNumber()"
      [achievementsByAppId]="achievementsByAppId()"
      [loadingAchievementsAppIds]="loadingAchievementsAppIds()"
      (searchChanged)="onSearchChanged($event)"
      (searchReset)="resetSearch()"
      (pageChanged)="onPageChanged($event)"
      (achievementsRequested)="loadAchievements($event)"
    />
  </ng-template>
</dash-widget>
