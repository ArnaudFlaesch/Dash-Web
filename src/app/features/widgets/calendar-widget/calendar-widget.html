<dash-widget
  [widgetData]="widgetData()"
  [isFormValid]="isFormValid()"
  [isWidgetLoaded]="isWidgetLoaded()"
  (refreshWidgetAction)="refreshWidget()"
  (editionCancelled)="restoreSavedConfig()"
>
  <ng-template #headerIcon>
    <mat-icon>calendar_month</mat-icon>
  </ng-template>

  <ng-template #headerTitle>
    <div>{{ labels.calendar }}</div>
  </ng-template>

  <ng-template #editComponent>
    <div id="calendar-urls-list-container" class="column gap-sm">
      @for (calendarUrlField of configForm.calendarUrls; track calendarUrlField; let index = $index) {
        <div class="calendar-url-container row items-center gap-xs">
          <input
            [formField]="calendarUrlField"
            [placeholder]="labels.enterIcalUrl"
            [attr.aria-label]="labels.calendarUrl"
          />
          <button
            mat-icon-button
            class="remove-calendar-url"
            [matTooltip]="labels.delete"
            [attr.aria-label]="labels.delete"
            (click)="removeCalendarUrl(index)"
          >
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>
      }
    </div>
    <button mat-stroked-button id="add-calendar-url" class="add-calendar-url-button" (click)="onCalendarUrlAdded()">
      <mat-icon>add</mat-icon>
      {{ labels.addCalendar }}
    </button>
  </ng-template>

  <ng-template #body>
    <dash-calendar-widget-view class="column" [events]="events()" (eventSelected)="openEventDetail($event)" />
  </ng-template>
</dash-widget>
