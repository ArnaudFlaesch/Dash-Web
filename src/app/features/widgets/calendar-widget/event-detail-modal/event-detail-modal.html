<h1 mat-dialog-title>{{ eventDetail.title }}</h1>
<mat-dialog-content>
  <div>{{ labels.start }} {{ eventDetail.start | dateFormat }}</div>
  @if (eventDetail.end) {
    <div>{{ labels.end }} {{ eventDetail.end | dateFormat }}</div>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-raised-button mat-dialog-close>{{ labels.ok }}</button>
</mat-dialog-actions>
