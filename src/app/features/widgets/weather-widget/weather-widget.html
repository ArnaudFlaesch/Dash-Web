<dash-widget
  [isFormValid]="isFormValid()"
  [widgetData]="widgetData()"
  [isWidgetLoaded]="isWidgetLoaded()"
  (refreshWidgetAction)="refreshWidget()"
  (editionCancelled)="restoreSavedConfig()"
>
  <ng-template #headerIcon>
    <mat-icon>sunny</mat-icon>
  </ng-template>

  <ng-template #headerTitle>
    <div>{{ labels.weatherTodayIn }} {{ config().city }}</div>
  </ng-template>

  <ng-template #editComponent>
    <mat-form-field appearance="outline">
      <mat-label>{{ labels.city }}</mat-label>
      <input id="city-name-input" matInput [formField]="configForm.city" [placeholder]="labels.enterCityName" />
    </mat-form-field>
  </ng-template>

  <ng-template #body>
    @if (cityData(); as cityData) {
      @if (weather(); as weather) {
        @if (weather.weather) {
          <dash-weather-widget-view [weather]="weather" [cityData]="cityData" [forecastResponse]="forecastResponse()" />
        }
      }
    }
  </ng-template>
</dash-widget>
