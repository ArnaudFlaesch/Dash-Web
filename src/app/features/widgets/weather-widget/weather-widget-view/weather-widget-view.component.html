<div class="weather-forecast-container column">
  <dash-weather-today [weather]="weather()" />
  <div class="forecast-data-container">
    <div class="forecast-selector">
      @for (date of forecastDays(); track date.getTime()) {
        <button
          [color]="isSelectedDay(date) ? 'primary' : ''"
          mat-raised-button
          (click)="selectDayForecast(date)"
          class="select-forecast"
        >
          {{ formatDate(date) | initialUppercase }}
        </button>
      }

      <button
        [color]="isForecastModeWeek() ? 'primary' : ''"
        mat-raised-button
        id="toggle-week-forecast"
        (click)="selectWeekForecast()"
      >
        {{ labels.week }}
      </button>
    </div>
    <div class="toggle-forecast">
      <mat-slide-toggle color="primary" [formField]="displayAllForecastForm">
        {{ labels.displayFullForecast }}
      </mat-slide-toggle>
    </div>
    <dash-weather-forecast
      [forecast]="forecastToDisplay()"
      [forecastMode]="forecastMode()"
      [timezone]="cityData().timezone"
    />
  </div>
</div>
