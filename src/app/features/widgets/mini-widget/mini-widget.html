<div class="mini-widget">
  @if (isModeEdit()) {
    <div class="edit-mini-widget row">
      <ng-container *ngTemplateOutlet="editComponent() ?? null" />

      @if (isWidgetLoaded() && isWidgetDataSaved() && widgetData()) {
        <button
          class="cancel-button"
          [matTooltip]="labels.cancel"
          [attr.aria-label]="labels.cancel"
          mat-icon-button
          (click)="cancelEdition()"
        >
          <mat-icon>undo</mat-icon>
        </button>
      }

      <button
        class="validate-button"
        [matTooltip]="labels.validate"
        [attr.aria-label]="labels.validate"
        mat-icon-button
        (click)="onValidation()"
        color="primary"
        [disabled]="!isFormValid()"
      >
        <mat-icon>check</mat-icon>
      </button>
      <button
        class="delete-button"
        mat-icon-button
        [matTooltip]="labels.deleteWidget"
        [attr.aria-label]="labels.deleteWidget"
        (click)="toDeleteMode()"
        color="alert"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  }

  @if (isModeDelete()) {
    <div class="delete-mini-widget">
      <h4>{{ labels.confirmDeletion }}</h4>
      <div class="delete-mini-widget-actions row gap-sm">
        <button (click)="toReadMode()" mat-button class="cancel-button">{{ labels.cancel }}</button>
        <button (click)="deleteWidget()" mat-raised-button color="warn" class="validate-deletion-button">
          {{ labels.delete }}
        </button>
      </div>
    </div>
  }

  @if (isModeRead()) {
    <!-- Touch gestures are kept, so that the list of mini widgets can be scrolled on phones -->
    <!-- A native button, so that it can also be edited with the keyboard (Enter or Space key) -->
    <!-- No click handler: a single click does not edit the mini widget, only a double click -->
    <button
      type="button"
      class="read-mini-widget"
      (dblclick)="toEditMode()"
      (keydown.enter)="toEditMode()"
      (keydown.space)="$event.preventDefault(); toEditMode()"
      [matTooltip]="labels.doubleClickToEdit"
      [matTooltipShowDelay]="800"
      matTooltipTouchGestures="off"
    >
      <div class="read-mini-widget-body-container">
        @if (isWidgetLoaded()) {
          <ng-container *ngTemplateOutlet="body()" />
        } @else {
          <div class="loading-spinner">
            <mat-spinner diameter="32" />
          </div>
        }
      </div>
    </button>
  }
</div>
