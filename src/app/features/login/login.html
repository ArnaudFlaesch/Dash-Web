<div id="login-page" class="centered full-height">
  <div id="login-container" class="surface column items-center">
    <a routerLink href="/home" id="logo-container">
      <img ngSrc="logo.png" width="62" height="106" priority id="dash-logo" class="app-logo" [alt]="labels.logoAlt" />
    </a>
    <h1 id="login-page-title">{{ labels.title }}</h1>
    <p id="login-page-subtitle" class="muted-text">{{ labels.subtitle }}</p>

    <form id="login-form" class="column" (submit)="$event.preventDefault(); login()">
      <mat-form-field appearance="outline">
        <mat-label>{{ labels.usernameLabel }}</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input
          matInput
          id="input-username"
          [placeholder]="labels.username"
          autocomplete="username"
          [formField]="loginForm.username"
          [attr.aria-label]="labels.username"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ labels.passwordLabel }}</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input
          matInput
          id="input-password"
          [placeholder]="labels.password"
          [type]="isPasswordVisible() ? 'text' : 'password'"
          autocomplete="current-password"
          [formField]="loginForm.password"
          [attr.aria-label]="labels.password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="isPasswordVisible.set(!isPasswordVisible())"
          [attr.aria-label]="isPasswordVisible() ? labels.hidePassword : labels.showPassword"
        >
          <mat-icon>{{ isPasswordVisible() ? "visibility_off" : "visibility" }}</mat-icon>
        </button>
      </mat-form-field>

      <button
        mat-flat-button
        id="login-button"
        type="submit"
        [disabled]="loginForm().invalid() || isLoading()"
        color="primary"
      >
        <span id="login-button-label" class="row items-center">
          @if (isLoading()) {
            <mat-spinner diameter="20" />
          }
          <span>{{ labels.login }}</span>
        </span>
      </button>

      <div id="login-separator" class="muted-text row items-center gap-sm">{{ labels.or }}</div>

      <button mat-stroked-button type="button" (click)="loginAsDemoAccount()">
        <mat-icon>visibility</mat-icon>
        {{ labels.tryDemo }}
      </button>
    </form>
  </div>
</div>
